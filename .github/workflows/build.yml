name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade buildozer cython==0.29.36
    - name: Accept Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo "24333f8a63b6825a656882fa2f2492895e9a6a0c1a7e2b3c6f8e8a3c1a7e2b3" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "8933bad161af4178b1185d1a37fbf41ea5269c\n24333f8a63b6825a656882fa2f2492895e9a6a0c1a7e2b3c6f8e8a3c1a7e2b3" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        yes | sdkmanager --licenses || true
      env:
        ANDROID_HOME: /opt/android_sdk
    - name: Build APK
      run: buildozer -v android debug
      env:
        P4A_ACCEPT_SDK_LICENSE: '1'
    - uses: actions/upload-artifact@v4
      with:
        name: ZoyaAI-APK
        path: bin/*.apk
