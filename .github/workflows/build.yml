name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build APK
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        workdir: .
        buildozer_version: stable
        command: buildozer -v android debug
    - uses: actions/upload-artifact@v4
      with:
        name: ZoyaAI-APK
        path: bin/*.apk
